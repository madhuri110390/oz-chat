static def gitRevision() {
    def cmd = "git rev-parse --short=8 HEAD"
    return cmd.execute().text.trim()
}

static def gitRevisionDate() {
    def cmd = "git show -s --format=%ci HEAD^{commit}"
    return cmd.execute().text.trim()
}

static def gitBranchName() {
    def cmd = "git rev-parse --abbrev-ref HEAD"
    return cmd.execute().text.trim()
}

// For Google Play build, build on any other branch than main will have a "-dev" suffix
//static def getGplayVersionSuffix() {
//    if (gitBranchName() == "main") {
//        return ""
//    } else {
//        return "-dev"
//    }
//}
static def getGplayVersionSuffix() {
    return "" // Always empty, so no "-dev" suffix
}
static def gitTag() {
    def cmd = "git describe --exact-match --tags"
    return cmd.execute().text.trim()
}

// For F-Droid build, build on a not tagged commit will have a "-dev" suffix
//static def getFdroidVersionSuffix() {
//    if (gitTag() == "") {
//        return "-dev"
//    } else {
//        return ""
//    }
//}
static def getFdroidVersionSuffix() {
    return ""
}
project.android.buildTypes.all { buildType ->
    buildType.javaCompileOptions.annotationProcessorOptions.arguments =
            [
                    validateEpoxyModelUsage: String.valueOf(buildType.name == 'debug')
            ]
}

// map for the version codes last digit
// x86 must have greater values than arm
// 64 bits have greater value than 32 bits
ext.abiVersionCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4].withDefault { 0 }

ext.apiFlavorCodes = [legacy: 1, modern: 2]

// ----------------- ADDED: helpers to control splits during bundle builds -----------------
def isBundleBuild = gradle.startParameter.taskNames.any {
    def n = it.toLowerCase()
    n.contains("bundle") || n.contains("prebundle")
}
// Enable splits only when explicitly requested AND not building a bundle
def enableApkSplits = project.hasProperty("enableApkSplits") &&
        project.property("enableApkSplits") == "true" &&
        !isBundleBuild
// ----------------------------------------------------------------------------------------

def baseCode = project.getVersionCode()

android {
    namespace "im.vector.application"
    // Due to a bug introduced in Android gradle plugin 3.6.0, we have to specify the ndk version to use
    // Ref: https://issuetracker.google.com/issues/144111441
    ndkVersion "26.1.10909125"
    compileSdk 36


    defaultConfig {
        applicationId "com.openzipper.ozchat"
        // Set to API 21: see #405
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        multiDexEnabled true

        externalNativeBuild {
            // For ndk-build, instead use the ndkBuild block.
            cmake {
                // Passes optional arguments to CMake.
                arguments += [
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DANDROID_PAGE_SIZE_AGNOSTIC=ON",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=0x4000"
                ]
            }
        }

        renderscriptTargetApi 24
        renderscriptSupportModeEnabled true


        // `develop` branch will have version code from timestamp, to ensure each build from CI has a incremented versionCode.
        // Other branches (main, features, etc.) will have version code based on application version.
        versionCode project.getVersionCode()

        // Required for sonar analysis
        versionName "${versionMajor}.${versionMinor}.${versionPatch}-sonar"

        // Generate a random app task affinity
        manifestPlaceholders = [appTaskAffinitySuffix: "H_${gitRevision()}"]

        buildConfigField "String", "GIT_REVISION", "\"${gitRevision()}\""
        buildConfigField "String", "GIT_REVISION_DATE", "\"${gitRevisionDate()}\""
        buildConfigField "String", "GIT_BRANCH_NAME", "\"${gitBranchName()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Keep abiFilter for the universalApk
        ndk {
            abiFilters "armeabi-v7a", "x86", 'arm64-v8a', 'x86_64'
        }

        // Ref: https://developer.android.com/studio/build/configure-apk-splits.html
        splits {
            // Configures multiple APKs based on ABI.
            abi {
                // Enables building multiple APKs per ABI.
                // CHANGED: was `enable true`
                enable enableApkSplits

                // By default all ABIs are included, so use reset() and include to specify that we only
                // want APKs for armeabi-v7a, x86, arm64-v8a and x86_64.

                // Resets the list of ABIs that Gradle should create APKs for to none.
                reset()

                // Specifies a list of ABIs that Gradle should create APKs for.
                include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"

                // Generate a universal APK that includes all ABIs, so user who install from CI tool can use this one by default.
                // CHANGED: only true when splits are enabled (not for bundles)
                universalApk enableApkSplits
            }
        }

        applicationVariants.all { variant ->
            if (!enableApkSplits) return

            // leave room for api (×10) and abi (×1)
            def base = variant.versionCode * 100

            // find this variant’s api flavor (legacy/modern)
            def apiFlavor = variant.productFlavors.find { it.dimension == 'api' }?.name
            def apiDigit  = (project.ext.apiFlavorCodes[apiFlavor] ?: 0) as int

            variant.outputs.each { output ->
                def abiDigit = project.ext.abiVersionCodes.get(output.getFilter(OutputFile.ABI))

                output.versionCodeOverride = base + apiDigit * 10 + abiDigit

                print "VAR ${variant.name} | API=${apiFlavor}(${apiDigit}) ABI=${output.getFilter(OutputFile.ABI)}(${abiDigit}) -> vCode ${output.versionCodeOverride}\n"

                output.outputFileName = output.outputFileName.replace("vector-app", "vector")
            }
        }

        // The following argument makes the Android Test Orchestrator run its
        // "pm clear" command after each test invocation. This command ensures
        // that the app's state is completely cleared between tests.
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    testOptions {
        // Disables animations during instrumented tests you run from the command line…
        // This property does not affect tests that you run using Android Studio.”
        animationsDisabled = true

        // Comment to run on Android 12
//        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    signingConfigs {
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('./signature/debug.keystore')
            storePassword 'android'
        }
        nightly {
/*            keyAlias System.env.ELEMENT_ANDROID_NIGHTLY_KEYID ?: project.property("signing.element.nightly.keyId")
            keyPassword System.env.ELEMENT_ANDROID_NIGHTLY_KEYPASSWORD ?: project.property("signing.element.nightly.keyPassword")
            storeFile file('./signature/jojocell-key.jks')
            storePassword System.env.ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD ?: project.property("signing.element.nightly.storePassword")*/
        }
        release {
            keyAlias project.property("signing.element.keyId")
            keyPassword project.property("signing.element.keyPassword")
            storeFile file(project.property("signing.element.storePath"))
            storePassword project.property("signing.element.storePassword")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.debug
            resValue "string", "app_name", "OZ-Chat"

            if (project.hasProperty("coverage")) {
                testCoverageEnabled = project.coverage == "true"
            }
        }

        release {
            resValue "string", "app_name", "OZ-Chat"
            postprocessing {
                // FIXME Set to true.
                removeUnusedCode false
                removeUnusedResources true
                // We do not activate obfuscation as it makes it hard then to read crash reports, and it's a bit useless on an open source project :)
                obfuscate false
                optimizeCode true
                proguardFiles 'proguard-rules.pro'
            }
            signingConfig signingConfigs.release
            // signingConfig signingConfigs.release
        }

        nightly {
            initWith release
            applicationIdSuffix ".nightly"
            versionNameSuffix ""
            // Just override the background color of the launcher icon for the nightly build.
            // We need to copy paste this block, this is not done automatically by `initWith release`
            postprocessing {
                // FIXME Set to true.
                removeUnusedCode false
                removeUnusedResources true
                // We do not activate obfuscation as it makes it hard then to read crash reports, and it's a bit useless on an open source project :)
                obfuscate false
                optimizeCode true
                proguardFiles 'proguard-rules.pro'
            }
            matchingFallbacks = ['release']
            signingConfig signingConfigs.nightly
            firebaseAppDistribution {
                artifactType = "APK"
                // We upload the universal APK to fix this error:
                // "App Distribution found more than 1 output file for this variant.
                // Please contact firebase-support@google.com for help using APK splits with App Distribution."
                artifactPath = "$rootDir/${getNightlyUniversalApkPath()}"
                // This file will be generated by the GitHub action
                releaseNotesFile = "CHANGES_NIGHTLY.md"
                groups = "external-testers"
                // This should not be required, but if I do not add the appId, I get this error:
                // "App Distribution halted because it had a problem uploading the APK: [404] Requested entity was not found."
                appId = "${getFirebaseAppId()}"
            }
        }
    }

    sourceSets {
        nightly {
            java.srcDirs += "src/release/java"
        }
    }

   // flavorDimensions = ["store"]
    flavorDimensions = ["store", "api"]

    productFlavors {
        gplay {
            apply plugin: 'com.google.gms.google-services'
            afterEvaluate {
                tasks.matching { it.name.contains("GoogleServices") && !it.name.contains("Gplay") }*.enabled = false
            }

            dimension "store"
            isDefault = true
//            versionName "${versionMajor}.${versionMinor}.${versionPatch}${getGplayVersionSuffix()}"
            versionName "${versionMajor}.${versionMinor}.${versionPatch}"
            buildConfigField "String", "SHORT_FLAVOR_DESCRIPTION", "\"G\""
            buildConfigField "String", "FLAVOR_DESCRIPTION", "\"GooglePlay\""
        }

        fdroid {
            dimension "store"
           // versionName "${versionMajor}.${versionMinor}.${versionPatch}${getFdroidVersionSuffix()}"
            versionName "${versionMajor}.${versionMinor}.${versionPatch}"
            buildConfigField "String", "SHORT_FLAVOR_DESCRIPTION", "\"F\""
            buildConfigField "String", "FLAVOR_DESCRIPTION", "\"FDroid\""
        }

        legacy {
            dimension "api"
            minSdk 23          // serves Android 5.0–7.1
            versionCode baseCode * 100 + 10
        }
        modern {
            dimension "api"
            minSdk 26          // serves Android 8.0+
            versionCode baseCode * 100 + 20
        }

    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        def buildType = variant.buildType.name
        // There is no nightly for fdroid
        if (names.contains("fdroid") && buildType == "nightly") {
            // Gradle ignores any variants that satisfy the conditions above.
            setIgnore(true)
        }
    }

    lint {
        lintConfig file("../tools/lint/lint.xml")

        checkDependencies true
        abortOnError true
    }

    compileOptions {
        sourceCompatibility versions.sourceCompat
        targetCompatibility versions.targetCompat
    }

    kotlinOptions {
        jvmTarget = versions.jvmTarget
        freeCompilerArgs += [
                "-opt-in=kotlin.RequiresOptIn",
                // Fixes false positive "This is an internal Mavericks API. It is not intended for external use."
                // of MvRx `by viewModel()` calls. Maybe due to the inlining of code... This is a temporary fix...
                "-opt-in=com.airbnb.mvrx.InternalMavericksApi",
                // Opt in for kotlinx.coroutines.FlowPreview too
                "-opt-in=kotlinx.coroutines.FlowPreview",
                // Opt in for kotlinx.coroutines.ExperimentalCoroutinesApi too
                "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
        ]
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

/*    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }*/

    packaging {
        pickFirsts.add("META-INF/LICENSE.md")
        pickFirsts.add("META-INF/LICENSE-notice.md")
        pickFirsts.add("MANIFEST.MF")
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

android.applicationVariants.all { variant ->
    // Dynamically handle all variants
    def navigationTaskName = "process${variant.name.capitalize()}NavigationResources"
    def resolvePlaceholdersTaskName = "resolve${variant.name.capitalize()}Placeholders"

    tasks.findByName(navigationTaskName)?.dependsOn(resolvePlaceholdersTaskName)
}

